<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Bendi · share image</title>
<!-- Template for og.png (1200x630), the image shown when the website is shared.
     Open at 1200x630 and take a screenshot. Same look as the hero of index.html. -->
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0e1324; }
  body { color: #e6ebf5; position: relative; font-family: "Atkinson Hyperlegible", sans-serif;
    background-image: radial-gradient(#242c48 1.2px, transparent 1.2px); background-size: 28px 28px; }
  .wrap { position: absolute; left: 80px; right: 80px; top: 112px; }
  .prompt { font: 600 30px "JetBrains Mono", monospace; }
  .prompt .u { color: #4ade80; } .prompt .d { color: #60a5fa; }
  h1 { margin: 6px 0 0; font: 800 176px/1 "JetBrains Mono", monospace; letter-spacing: -0.045em; }
  h1 .cur { color: #38bdf8; }
  .who { font: 750 40px/1.2 "Bricolage Grotesque", sans-serif; font-variation-settings: "wdth" 85; margin-top: 18px; }
  .who span { color: #93a0b8; font-weight: 500; }
  .stack { display: flex; gap: 10px; margin-top: 28px; }
  .stack i { font: 400 20px "Atkinson Hyperlegible", sans-serif; font-style: normal; color: #93a0b8;
    border: 1.5px solid #242c48; background: #0e1324; border-radius: 999px; padding: 5px 15px; }
  .me { position: absolute; right: 80px; top: 112px; width: 176px; height: 176px; image-rendering: pixelated;
    background: #151b31; padding: 14px; border-radius: 18px; border: 1.5px solid #242c48; }
  .url { position: absolute; right: 80px; bottom: 44px; font: 600 26px "JetBrains Mono", monospace; color: #38bdf8; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; display: flex; }
  .bar i { flex: 1; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="prompt"><span class="u">bendi@localhost</span>:<span class="d">~</span>$ whoami</div>
    <h1>Bendi<span class="cur">_</span></h1>
    <div class="who">Sergio Bendaña <span>· Automation Platform Engineer</span></div>
    <div class="stack"><i>Terraform</i><i>Ansible</i><i>Python</i><i>Linux/UNIX</i><i>AWS · Azure</i><i>Blockchain</i><i>8-bit games</i></div>
  </div>
  <img class="me" src="img/bendi.svg" alt="">
  <div class="url">bendi.dev</div>
  <div class="bar"><i style="background:#38bdf8"></i><i style="background:#36d399"></i><i style="background:#a78bfa"></i><i style="background:#f472b6"></i></div>
</body>
</html>
