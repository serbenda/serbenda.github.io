<!doctype html>
<!-- Printable CV template. Open as cv.html?lang=es or ?lang=en; tools/cv/build.py prints both to PDF. -->
<html>
<head>
<meta charset="utf-8">
<title>Sergio Bendaña · CV</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<style>
  @page { size: A4; margin: 14mm 13mm 12mm; }
  :root { --ink: #0e1324; --text: #1d2433; --muted: #334155; --soft: #5c616c; --line: #cbd5e1;
          --accent: #2563eb; --term: #0f766e; --bullet: #7c3aed; --chip: #eef2ff; }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--text); font: 10.1pt/1.42 "Atkinson Hyperlegible", sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .mono { font-family: "JetBrains Mono", monospace; }
  header { display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 8px; border-bottom: 3px solid var(--ink); }
  .prompt { margin: 0; color: var(--term); font-size: 9pt; font-weight: 600; }
  h1 { margin: 0; font: 800 29pt/1.1 "Bricolage Grotesque", sans-serif; color: var(--ink); letter-spacing: -.01em; }
  .role { margin: 0; color: var(--accent); font: 700 12pt/1.3 "Atkinson Hyperlegible", sans-serif; }
  .links { text-align: right; font-size: 9pt; line-height: 1.75; color: var(--text); }
  .summary { margin: 12px 0 10px; }
  .chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; margin-bottom: 14px; }
  .chips div { background: var(--chip); border-radius: 6px; padding: 7px 8px; font-weight: 700; font-size: 9pt; line-height: 1.3; color: #1e1b4b; }
  h2 { margin: 12px 0 6px; padding-bottom: 3px; border-bottom: 1px solid var(--line); font: 800 12.5pt "Bricolage Grotesque", sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); }
  .job { break-inside: avoid; margin-bottom: 6px; }
  .job-h { display: flex; justify-content: space-between; align-items: baseline; }
  .job-h b { font: 700 10.8pt "Bricolage Grotesque", sans-serif; color: var(--ink); }
  .job-h span { font-size: 9pt; color: var(--soft); }
  .sub { margin: 0; font-style: italic; color: var(--muted); }
  ul { margin: 3px 0 0; padding-left: 15px; }
  li { margin: 1px 0; }
  li::marker { color: var(--bullet); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 24px; }
  .item b { display: block; font: 700 10pt "Bricolage Grotesque", sans-serif; color: var(--ink); }
  .item span { color: var(--muted); }
  .block p { margin: 0 0 6px; }
  .block b { font: 700 10.4pt "Bricolage Grotesque", sans-serif; color: var(--ink); }
  footer { margin-top: 12px; text-align: center; font-size: 8.5pt; color: var(--soft); }
</style>
</head>
<body>
<main id="cv"></main>
<script src="cv-data.js"></script>
<script>
  const lang = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'es';
  const d = window.CV[lang];
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  document.documentElement.lang = lang;
  document.getElementById('cv').innerHTML = `
    <header>
      <div><p class="prompt mono">bendi@localhost:~$ whoami</p><h1>Sergio Bendaña</h1><p class="role">${esc(d.title)}</p></div>
      <div class="links mono">${d.links.map(esc).join('<br>')}</div>
    </header>
    <p class="summary">${esc(d.summary)}</p>
    <div class="chips">${d.chips.map((c) => `<div>${esc(c)}</div>`).join('')}</div>
    <h2>${esc(d.h.exp)}</h2>
    ${d.jobs.map((j) => `<section class="job">
      <div class="job-h"><b>${esc(j.t)}</b><span class="mono">${esc(j.d)}</span></div>
      <p class="sub">${esc(j.s)}</p>
      <ul>${j.b.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></section>`).join('')}
    <h2>${esc(d.h.skills)}</h2>
    <div class="grid">${d.skills.map(([t, x]) => `<div class="item"><b>${esc(t)}</b><span>${esc(x)}</span></div>`).join('')}</div>
    <h2>${esc(d.h.edu)}</h2>
    <div class="block">${d.edu.map(([t, x]) => `<p><b>${esc(t)}</b><br>${esc(x)}</p>`).join('')}</div>
    <h2>${esc(d.h.projects)}</h2>
    <div class="block">${d.projects.map(([t, x]) => `<p><b>${esc(t)}</b><br>${esc(x)}</p>`).join('')}</div>
    <footer class="mono">${esc(d.footer)}</footer>`;
</script>
</body>
</html>
